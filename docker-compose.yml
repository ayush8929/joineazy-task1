version: '3.8'

# This compose file runs a fully self-contained local stack — its own
# Postgres container, not your Neon cloud database — so the whole app
# can be started with one command on any machine, no cloud account needed.
# (Your local dev workflow can keep using Neon via backend/.env; this is
# a separate, independent setup used for the Docker deliverable / demo.)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: joineazy_user
      POSTGRES_PASSWORD: joineazy_pass
      POSTGRES_DB: joineazy_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joineazy_user -d joineazy_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      # Local compose Postgres has no connection-count limits like Neon does,
      # so DATABASE_URL and DIRECT_URL can safely be the same value here.
      DATABASE_URL: postgresql://joineazy_user:joineazy_pass@postgres:5432/joineazy_db
      DIRECT_URL: postgresql://joineazy_user:joineazy_pass@postgres:5432/joineazy_db
      JWT_SECRET: change_this_to_a_long_random_string
      JWT_EXPIRES_IN: 7d
      CLIENT_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
